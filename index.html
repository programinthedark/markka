<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Markka">
<meta name="theme-color" content="#f7f6f2">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Markka</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f6f2;--ink:#141414;--mute:#76746e;--line:#e6e4dd;--accent:#1f5135;--warn:#9a3b1b}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:430px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 24px 48px}
.serif{font-family:ui-serif,"New York",Georgia,serif;font-weight:400;letter-spacing:-.5px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.brand{font-size:22px}
.month{font-size:13px;color:var(--mute);display:flex;gap:14px;align-items:center}
.month button{background:none;border:0;font:inherit;color:var(--ink);font-size:18px;padding:0 4px}
.month button:disabled{color:var(--line)}
.eyebrow{font-size:13px;color:var(--mute);margin-bottom:6px}
.balance{font-size:56px;line-height:1}
.balance small{font-size:28px;color:var(--mute)}
.meta{margin-top:10px;font-size:14px;color:var(--mute)}
.meta b{font-weight:500}.ok{color:var(--accent)}.over{color:var(--warn)}
svg{display:block;margin:28px 0 8px;width:100%;height:auto}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-bottom:32px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:36px}
.stat{padding:16px 0}.stat+.stat{padding-left:16px;border-left:1px solid var(--line)}
.stat .k{font-size:12px;color:var(--mute)}.stat .v{font-size:22px;margin-top:2px}
h2{font-size:20px;margin-bottom:14px}
.sec{margin-bottom:36px}
.cat{display:flex;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.cat .l{flex:1}.cat .p{font-size:12px;color:var(--mute);margin-left:8px}
.cat .a{width:64px;text-align:right;margin-left:20px;font-variant-numeric:tabular-nums}
.track{height:3px;background:var(--line);margin-top:8px;border-radius:2px}
.track i{display:block;height:100%;background:var(--ink);border-radius:2px}
.t{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.mono{flex:none;width:38px;height:38px;border-radius:50%;background:#ecebe5;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#3d3c38}
.t .w{flex:1;min-width:0}.t .w div{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .w span{font-size:12px;color:var(--mute)}
.t .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.t .amt span{display:block;font-size:12px;color:var(--mute)}
.t .amt.in{color:var(--accent)}
.a.ok{color:var(--accent)}
.more{display:block;width:100%;padding:14px;background:none;border:1px solid var(--line);border-radius:12px;font:inherit;color:var(--ink);margin-top:14px}
.foot{font-size:12px;color:var(--mute);text-align:center}
.gate{padding-top:30vh;text-align:center;color:var(--mute)}
</style></head><body><div class="wrap" id="app"><div class="gate"><div class="brand serif" style="font-size:40px;color:var(--ink)">Markka</div><p id="msg" style="margin-top:12px">Loading…</p></div></div>
<script>
const $ = s => document.querySelector(s);
const fmt = (n, d = 0) => (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-CA', {minimumFractionDigits: d, maximumFractionDigits: d});
const ymd = d => d.toISOString().slice(0, 10);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let DATA, view, showAll = false;

async function load() {
  const hash = new URLSearchParams(location.search.slice(1) || location.hash.slice(1));
  if (hash.get('k')) { localStorage.setItem('markka-key', hash.get('k')); localStorage.setItem('markka-api', hash.get('u')); }
  const k = localStorage.getItem('markka-key'), u = localStorage.getItem('markka-api');
  if (!k || !u) { $('#msg').textContent = 'Open your personal install link once to unlock.'; return; }
  const cached = localStorage.getItem('markka-cache');
  if (cached) { DATA = JSON.parse(cached); start(); }
  try {
    const res = await fetch(`https://script.google.com/macros/s/${u}/exec?key=${k}&t=${Date.now()}`);
    const d = await res.json();
    if (!d.ok) throw new Error('locked');
    DATA = d; localStorage.setItem('markka-cache', JSON.stringify(d)); start();
  } catch (e) { if (!DATA) $('#msg').textContent = 'Could not reach Markka. Check your connection.'; }
}

function start() {
  render();
}

function monthTx(y, m) {
  const p = `${y}-${String(m + 1).padStart(2, '0')}`;
  return DATA.txns.filter(t => t.date.startsWith(p));
}

const isTrip = t => t.trip || (t.date >= DATA.budget.tripStart && t.date <= DATA.budget.tripEnd);
const spendOf = list => -list.filter(t => t.amount < 0 && !t.transfer).reduce((s, t) => s + t.amount, 0);
const localYmd = d => ymd(new Date(d - d.getTimezoneOffset() * 6e4));

function txRow(t, todayStr) {
  const initials = t.merchant.replace(/[^A-Za-zÀ-ÿ ]/g, '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '·';
  const d = new Date(t.date + 'T12:00');
  const when = t.date === todayStr ? 'Today' : `${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
  const eur = t.eur ? `<span>€${Math.abs(t.eur).toFixed(2)}</span>` : '';
  return `<div class="t"><div class="mono">${initials}</div><div class="w"><div>${t.merchant}</div><span>${when} · ${t.cat}</span></div><div class="amt${t.amount > 0 ? ' in' : ''}">${t.amount > 0 ? '+' : ''}${fmt(Math.abs(t.amount), 2)}${eur}</div></div>`;
}

function catRows(list) {
  const total = spendOf(list), cats = {};
  list.filter(t => t.amount < 0 && !t.transfer).forEach(t => cats[t.cat] = (cats[t.cat] || 0) - t.amount);
  return Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, a]) => {
    const pc = total ? Math.round(a / total * 100) : 0;
    return `<div class="cat"><div class="l">${c}<span class="p">${pc}%</span><div class="track"><i style="width:${pc}%"></i></div></div><span class="a">${fmt(a)}</span></div>`;
  }).join('') || '<p class="foot" style="text-align:left">Nothing yet.</p>';
}

function render() {
  const B = DATA.budget, plan = DATA.plan || {upcoming: [], funding: []}, rate = DATA.eurcad || 1.55;
  const today = new Date(), todayStr = localYmd(today);
  const trip = DATA.txns.filter(isTrip);
  const spent = spendOf(trip);
  const before = spendOf(trip.filter(t => t.date < B.tripStart));
  const during = spent - before;
  const left = B.trip - spent;
  const daysToGo = Math.ceil((new Date(B.tripStart + 'T00:00') - today) / 864e5);
  const away = todayStr >= B.tripStart && todayStr <= B.tripEnd;
  const won = plan.funding.filter(f => f.status === 'won').reduce((s, f) => s + f.amount, 0);
  const pending = plan.funding.filter(f => f.status !== 'won').reduce((s, f) => s + f.amount, 0);
  const up = plan.upcoming.map(u => ({...u, cad: u.amount ?? (u.eur ? Math.round(u.eur * rate) : null)}));
  const upTotal = up.reduce((s, u) => s + (u.cad || 0), 0);
  const [whole, cents] = Math.abs(left).toFixed(2).split('.');
  const pc = Math.min(100, spent / B.trip * 100);

  // this-month block, only while away
  let month = '';
  if (away) {
    const y = today.getFullYear(), m = today.getMonth(), days = new Date(y, m + 1, 0).getDate(), dn = today.getDate();
    const p = `${y}-${String(m + 1).padStart(2, '0')}`;
    const mt = trip.filter(t => t.date.startsWith(p) && t.date >= B.tripStart);
    const ms = spendOf(mt), ml = B.monthly - ms, perDay = Math.max(0, ml) / (days - dn + 1);
    const daily = Array(days + 1).fill(0);
    mt.filter(t => t.amount < 0 && !t.transfer).forEach(t => daily[+t.date.slice(8, 10)] += -t.amount);
    const W = 342, H = 90, top = Math.max(B.monthly, ms) * 1.05; let cum = 0; const pts = [];
    for (let d = 1; d <= dn; d++) { cum += daily[d]; pts.push([(d - 1) / (days - 1) * W, H - 4 - cum / top * (H - 8)]); }
    const path = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1] || [0, H - 4];
    month = `<div class="sec"><h2 class="serif">${MONTHS[m]}</h2>
      <div class="meta" style="margin:0">${fmt(Math.max(0, ml))} left of ${fmt(B.monthly)} · <b class="${ms <= B.monthly * dn / days ? 'ok' : 'over'}">${fmt(perDay)} a day</b></div>
      <svg viewBox="0 0 ${W} ${H}" style="margin:18px 0 6px"><line x1="0" y1="${H - 4}" x2="${W}" y2="${H - 4 - B.monthly / top * (H - 8)}" stroke="#d6d3ca" stroke-width="1.5" stroke-dasharray="3 4"/>
      <path d="${path}" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#141414"/></svg>
      <div class="axis" style="margin-bottom:0"><span>${MONTHS[m].slice(0, 3)} 1</span><span>${MONTHS[m].slice(0, 3)} ${days}</span></div></div>`;
  }

  const upRows = up.map(u => `<div class="t"><div class="mono">◷</div><div class="w"><div>${u.what}</div><span>${u.due} · ${u.cat}</span></div><div class="amt">${u.cad ? '≈ ' + fmt(u.cad) : '<span style="display:inline">price TBD</span>'}${u.eur ? `<span>€${u.eur}</span>` : ''}</div></div>`).join('');
  const fundRows = plan.funding.map(f => `<div class="cat"><div class="l">${f.what}<span class="p">${f.status}</span></div><span class="a ${f.status === 'won' ? 'ok' : ''}" style="width:80px">${fmt(f.amount)}</span></div>`).join('');

  const list = [...trip].sort((a, b) => b.date.localeCompare(a.date));
  const shown = showAll ? list : list.slice(0, 12);
  const ago = Math.round((Date.now() - new Date(DATA.updated)) / 6e4);

  $('#app').innerHTML = `
  <div class="nav"><div class="brand serif">Markka</div><div class="month">Finland 2027</div></div>
  <div class="eyebrow">${left >= 0 ? 'Trip budget left' : 'Over trip budget'}</div>
  <div class="balance serif ${left < 0 ? 'over' : ''}">${left < 0 ? '−' : ''}$${(+whole).toLocaleString('en-CA')}<small>.${cents}</small></div>
  <div class="meta">Spent ${fmt(spent)} of ${fmt(B.trip)} · ${away ? '<b class="ok">In Europe</b>' : daysToGo > 0 ? `${daysToGo} days until you fly` : 'Trip done'}</div>
  <div class="track" style="height:4px;margin:24px 0 32px"><i style="width:${pc}%"></i></div>
  <div class="stats">
    <div class="stat"><div class="k">Before you go</div><div class="v serif">${fmt(before)}</div></div>
    <div class="stat"><div class="k">In Europe</div><div class="v serif">${fmt(during)}</div></div>
    <div class="stat"><div class="k">Funding</div><div class="v serif">${fmt(won)}</div></div>
  </div>
  ${month}
  ${up.length ? `<div class="sec"><h2 class="serif">Still to pay</h2>${upRows}<p class="foot" style="text-align:left;margin-top:10px">≈ ${fmt(upTotal)} known so far</p></div>` : ''}
  <div class="sec"><h2 class="serif">Where it went</h2>${catRows(trip)}</div>
  <div class="sec"><h2 class="serif">Activity</h2>${shown.map(t => txRow(t, todayStr)).join('') || '<p class="foot" style="text-align:left">No activity.</p>'}
    ${list.length > 12 && !showAll ? `<button class="more" id="more">Show all ${list.length}</button>` : ''}</div>
  <div class="sec"><h2 class="serif">Funding</h2>${fundRows}<p class="foot" style="text-align:left;margin-top:10px">${fmt(won)} won${pending ? ` · ${fmt(pending)} pending` : ''} · ${won - spent - upTotal >= 0 ? 'covers' : 'short by ' + fmt(spent + upTotal - won) + ' for'} spending so far + known costs</p></div>
  <div class="foot">Synced ${ago < 60 ? ago + ' min ago' : Math.round(ago / 60) + ' h ago'}</div>`;
  if ($('#more')) $('#more').onclick = () => { showAll = true; render(); };
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
load();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script></body></html>
